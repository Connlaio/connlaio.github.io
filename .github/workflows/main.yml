# 博客构建与部署流水线
# 触发：push 到 hexo 分支（或手动触发）
# 流程：安装依赖 → hexo 构建 → 推送生成结果到 master 分支（GitHub Pages 服务）
name: CI

on:
  push:
    branches: [ "hexo" ]
  workflow_dispatch:

# 部署需要向 master 分支推送，授予工作流写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: hexo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install -g hexo-cli
          npm install

      - name: Prepare git env
        run: |
          sudo timedatectl set-timezone "Asia/Shanghai"
          git config --global user.email xukang-11@live.com
          git config --global user.name connerxu
          # 使用 GitHub 内置 Token 以 HTTPS 推送（替代已失效的 SSH 部署密钥）
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"

      - name: Generate site
        run: |
          hexo clean
          hexo generate

      - name: Deploy to master
        run: |
          hexo deploy
